version: "3.9"

# Optional local Postgres + MinIO-style layout preview.
# Default local app uses SQLite + ./uploads (no compose required).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: refex_tms
      POSTGRES_USER: tms_user
      POSTGRES_PASSWORD: tms_pass
    ports:
      - "5432:5432"
    volumes:
      - tms_pg:/var/lib/postgresql/data

  # Emulates separate attachments bucket locally (S3-compatible).
  # Wire STORAGE_DRIVER=gcs in Cloud Run; locally keep STORAGE_DRIVER=local.
  # minio:
  #   image: minio/minio
  #   command: server /data --console-address ":9001"
  #   ports:
  #     - "9000:9000"
  #     - "9001:9001"
  #   environment:
  #     MINIO_ROOT_USER: minio
  #     MINIO_ROOT_PASSWORD: minio123
  #   volumes:
  #     - tms_obj:/data

volumes:
  tms_pg:
  # tms_obj:
