    <rect x="88" y="66" width="100" height="12" rx="4" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <rect x="94" y="70" width="40" height="4" rx="2" fill="#334155"/>
    <rect x="144" y="70" width="36" height="4" rx="2" fill="#2563EB"/>

