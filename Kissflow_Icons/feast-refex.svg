<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  
  <defs>
    <filter id="drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.18"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.22"/>
    </filter>
    <filter id="glow-badge" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.3"/>
    </filter>
    <filter id="gold-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#D97706" flood-opacity="0.35"/>
    </filter>

    <linearGradient id="clocheGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="goldPlate2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="silverCutlery2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>

  <ellipse cx="128" cy="226" rx="78" ry="12" fill="#0F172A" opacity="0.15" filter="blur(6px)"/>

  <!-- Left Fine Dining Fork -->
  <g filter="url(#drop-shadow)" transform="translate(46, 60)">
    <rect x="8" y="46" width="7" height="96" rx="3.5" fill="url(#silverCutlery2)"/>
    <path d="M 5 36 Q 11.5 44 18 36 L 18 16 L 5 16 Z" fill="url(#silverCutlery2)"/>
    <rect x="4.5" y="2" width="2.5" height="26" rx="1.25" fill="url(#silverCutlery2)"/>
    <rect x="10.25" y="2" width="2.5" height="26" rx="1.25" fill="url(#silverCutlery2)"/>
    <rect x="16" y="2" width="2.5" height="26" rx="1.25" fill="url(#silverCutlery2)"/>
  </g>

  <!-- Right Fine Dining Spoon -->
  <g filter="url(#drop-shadow)" transform="translate(188, 60)">
    <rect x="8" y="46" width="7" height="96" rx="3.5" fill="url(#silverCutlery2)"/>
    <ellipse cx="11.5" cy="24" rx="14" ry="24" fill="url(#silverCutlery2)"/>
    <ellipse cx="11.5" cy="24" rx="10" ry="18" fill="#CBD5E1" opacity="0.5"/>
  </g>

  <!-- Center Dining Cloche Dome & Plate -->
  <g filter="url(#soft-shadow)">
    <!-- Golden Platter Rim -->
    <ellipse cx="128" cy="182" rx="68" ry="16" fill="url(#goldPlate2)"/>
    <ellipse cx="128" cy="180" rx="64" ry="13" fill="#FFFFFF"/>

    <!-- Cloche Dome Cover (Clean 58px Height Semi-Circle Arch) -->
    <path d="M 70 178 A 58 54 0 0 1 186 178 Z" fill="url(#clocheGrad2)"/>
    <path d="M 82 172 A 46 42 0 0 1 174 172" stroke="#FFFFFF" stroke-width="4" fill="none" opacity="0.8"/>

    <!-- Gold Knob Handle Mounted Directly on Top of Dome Arch (y=124) -->
    <rect x="124" y="120" width="8" height="6" rx="2" fill="#B45309"/>
    <circle cx="128" cy="114" r="11" fill="url(#goldPlate2)"/>
    <ellipse cx="126" cy="111" rx="5" ry="2.5" fill="#FEF08A"/>
  </g>

  <!-- Culinary Aroma / Steam Swirls Above Knob -->
  <g stroke="#F59E0B" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <path d="M 116 94 Q 108 80 116 66 Q 124 52 118 38"/>
    <path d="M 128 96 Q 136 82 128 68 Q 120 54 128 40"/>
    <path d="M 140 94 Q 148 80 140 66 Q 132 52 140 38"/>
  </g>
</svg>